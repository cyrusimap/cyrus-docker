name: Create and publish an OCI image

on:
  push:
    branches: [ 'dev', 'master' ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      debian:
        description: Debian release to build on
        type: choice
        options: [ all, bookworm, trixie ]
        default: all
      cyruslibs:
        description: "cyruslibs ref (branch or tag) to build against, e.g. cyruslibs-fastmail-v68; empty for master"
        type: string
        default: ""
      jmap-testsuite:
        description: "JMAP-TestSuite ref (branch, tag, or commit) to install; empty for master"
        type: string
        default: ""
      suffix:
        description: "Tag suffix naming an alternative image, e.g. libs68 -> trixie-libs68; required when cyruslibs or jmap-testsuite is set"
        type: string
        default: ""
      push:
        description: Push the images to GHCR (off to just check that they build)
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  plan:
    # Turn the inputs (from dispatch or defaults) into the values the build and
    # merge jobs share.
    name: Work out what to build
    runs-on: ubuntu-24.04
    outputs:
      debians: ${{ steps.plan.outputs.debians }}
      cyruslibs: ${{ steps.plan.outputs.cyruslibs }}
      jmap-testsuite: ${{ steps.plan.outputs.jmap-testsuite }}
      tag-tail: ${{ steps.plan.outputs.tag-tail }}
      push: ${{ steps.plan.outputs.push }}
    steps:
      - id: plan
        env:
          DEBIAN: ${{ inputs.debian || 'all' }}
          CYRUSLIBS: ${{ inputs.cyruslibs || 'master' }}
          JMAP_TESTSUITE: ${{ inputs.jmap-testsuite || 'master' }}
          SUFFIX: ${{ inputs.suffix }}
          BRANCH: ${{ github.ref_name }}
          PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        run: |
          if [ -z "$SUFFIX" ] && { [ "$CYRUSLIBS" != master ] || [ "$JMAP_TESTSUITE" != master ]; }; then
            echo "::error::a tag suffix is required when building with an alternative cyruslibs or JMAP-TestSuite"
            exit 1
          fi
          if [ -n "$SUFFIX" ] && ! [[ "$SUFFIX" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::the tag suffix may only contain letters, digits, and _ . -"
            exit 1
          fi

          # Image tags are "{debian}{tail}".  master publishes the bare Debian
          # name (e.g. "trixie"); every other branch appends the branch (e.g.
          # "trixie-dev"); an alternative image appends its suffix after that
          # (e.g. "trixie-libs68", or "trixie-dev-libs68").
          tail=""
          if [ "$BRANCH" != master ]; then
            tail="-$(echo -n "$BRANCH" | tr -c 'A-Za-z0-9_.-' -)"
          fi
          if [ -n "$SUFFIX" ]; then
            tail="$tail-$SUFFIX"
          fi

          case "$DEBIAN" in
            all) debians='["bookworm","trixie"]' ;;
            *)   debians="[\"$DEBIAN\"]" ;;
          esac
          {
            echo "debians=$debians"
            echo "cyruslibs=$CYRUSLIBS"
            echo "jmap-testsuite=$JMAP_TESTSUITE"
            echo "tag-tail=$tail"
            echo "push=$PUSH"
          } >> "$GITHUB_OUTPUT"

  build-and-push-image:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        platform: [ "", "-arm" ]
        debian: ${{ fromJson(needs.plan.outputs.debians) }}
    runs-on: ubuntu-24.04${{ matrix.platform }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push-by-digest needs the docker-container driver; the default "docker"
      # driver can't do it.  setup-buildx-action gives us that builder.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      # A short, filesystem-safe name for this leg's architecture (amd/arm),
      # used to name the per-arch digest artifact uploaded below.
      - name: Name this architecture
        run: echo "ARCH=${{ matrix.platform == '' && 'amd' || 'arm' }}" >> "$GITHUB_ENV"

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.cyrusimap.cyrus-docker.built-from=${{ github.sha }}

      # Each build runs on a single native architecture and pushes an *untagged*
      # image, identified only by digest (push-by-digest).  The merge-manifests
      # job stitches the per-arch digests into the tagged, multi-arch manifest
      # lists.
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: Debian
          build-args: |
            DEBIAN_VERSION=${{ matrix.debian }}
            CYRUSLIBS_BRANCH=${{ needs.plan.outputs.cyruslibs }}
            JMAP_TESTSUITE_REF=${{ needs.plan.outputs.jmap-testsuite }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ needs.plan.outputs.push == 'true' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || 'type=cacheonly' }}

      - name: Generate artifact attestation
        if: needs.plan.outputs.push == 'true'
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

      # Hand the digest to the merge job as an empty file named after it.  The
      # artifact name is scoped by Debian version so each merge leg picks up
      # only its own architectures.
      - name: Export digest
        if: needs.plan.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.plan.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.debian }}-${{ env.ARCH }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    # Combine the per-architecture digests pushed above into one tagged,
    # multi-arch manifest list per Debian version.
    needs: [ plan, build-and-push-image ]
    if: needs.plan.outputs.push == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debian: ${{ fromJson(needs.plan.outputs.debians) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests for this Debian version
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.debian }}-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Extract metadata (tags) for the manifest list
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The plan job explains the tag scheme.
          tags: type=raw,value=${{ matrix.debian }}${{ needs.plan.outputs.tag-tail }}

      - name: Create the multi-arch manifest list
        working-directory: /tmp/digests
        run: |
          # I swear I didn't invent this, it's code from the wild.  We want to
          # run: docker buildx imagetools create -t tag1 -t tag2 hash1 hash2...
          #
          # In /tmp/digests, we wrote all the digests we want to collect,
          # per-arch, so that's that.  Looks bonkers, but is simpler.
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=Cyrus IMAP development and CI image" \
            --annotation "index:org.cyrusimap.cyrus-docker.cyruslibs=${{ needs.plan.outputs.cyruslibs }}" \
            --annotation "index:org.cyrusimap.cyrus-docker.jmap-testsuite=${{ needs.plan.outputs.jmap-testsuite }}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect the manifest list
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
